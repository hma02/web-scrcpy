<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Select Device - Web Scrcpy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .selector-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            min-height: 200px;
        }

        .device-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .device-card.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #764ba2;
            color: white;
        }

        .device-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .device-card.selected .device-icon {
            color: white;
        }

        .device-info {
            word-break: break-all;
            font-size: 12px;
        }

        .device-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .device-card.selected .device-name {
            color: white;
        }

        .device-id {
            color: #666;
            font-size: 11px;
        }

        .device-card.selected .device-id {
            color: #e0e0e0;
        }

        .status {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background-color: #ffebee;
            color: #c62828;
        }

        .status.info {
            background-color: #f3e5f5;
            color: #6a1b9a;
        }

        .status i {
            margin-right: 8px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .pin-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .pin-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .pin-history {
            max-height: 160px;
            overflow: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .pin-history table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .pin-history th, .pin-history td {
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            text-align: left;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #5568d3;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="selector-box">
            <div class="header">
                <h1>📱 Select Device</h1>
                <p>Choose one or more devices to begin streaming</p>
            </div>

            <div class="status loading show" id="status">
                <span class="spinner"></span>
                <span id="statusText">Scanning for devices...</span>
            </div>

            <div class="devices-grid" id="devicesList">
                <!-- Devices will be populated here -->
            </div>

            <div class="pin-row">
                <input id="pinInput" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Memorized PIN">
                <button class="btn btn-secondary" onclick="savePin()">
                    <i class="fa-solid fa-key"></i> Save PIN
                </button>
            </div>

            <div class="pin-history">
                <table>
                    <thead>
                        <tr>
                            <th>PIN</th>
                            <th>Saved at</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pinHistoryBody"></tbody>
                </table>
            </div>

            <div class="buttons">
                <button class="btn btn-secondary" onclick="scanDevices()">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
                <button class="btn btn-primary" id="connectBtn" onclick="connectToDevice()" disabled>
                    <i class="fa-solid fa-play"></i> Connect
                </button>
            </div>
        </div>
    </div>

    <script>
        let availableDevices = [];
        let selectedDevices = [];
        let pinSaveTimer = null;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            
            status.className = `status show ${type}`;
            
            if (type === 'loading') {
                statusText.innerHTML = `<span class="spinner"></span>${message}`;
            } else {
                const icons = {
                    error: 'fa-circle-exclamation',
                    info: 'fa-circle-info'
                };
                statusText.innerHTML = `<i class="fa-solid ${icons[type]}"></i>${message}`;
            }
        }

        async function scanDevices() {
            showStatus('Scanning for devices...', 'loading');
            try {
                const response = await fetch('/api/devices');
                availableDevices = await response.json();

                if (availableDevices.length === 0) {
                    showStatus('No devices found. Please connect an Android device via USB.', 'error');
                    return;
                }

                if (availableDevices.length === 1) {
                    showStatus(`Found ${availableDevices.length} device. Select it to begin streaming.`, 'info');
                } else {
                    showStatus(`Found ${availableDevices.length} devices. Select up to 3 devices to stream (single/dual/multi-view).`, 'info');
                }

                renderDevices();
            } catch (error) {
                showStatus(`Error scanning devices: ${error.message}`, 'error');
                console.error('Scan error:', error);
            }
        }

        async function loadPin() {
            try {
                const response = await fetch('/api/pin');
                const data = await response.json();
                document.getElementById('pinInput').value = data.pin || '';
                renderPinHistory(data.history || []);
            } catch (error) {
                console.error('Load PIN error:', error);
            }
        }

        function renderPinHistory(historyRows) {
            const tbody = document.getElementById('pinHistoryBody');
            tbody.innerHTML = '';
            if (!historyRows.length) {
                tbody.innerHTML = '<tr><td colspan=\"3\" style=\"color:#999;\">No saved PIN history yet.</td></tr>';
                return;
            }
            historyRows.forEach((row) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.masked_pin}</td>
                    <td>${row.saved_at}</td>
                    <td><button class=\"btn btn-secondary\" style=\"padding:4px 8px;font-size:11px;\" onclick=\"usePinHistory(${row.id})\">Use</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function usePinHistory(historyId) {
            try {
                const response = await fetch('/api/pin/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: historyId })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to use PIN history');
                }
                document.getElementById('pinInput').value = data.pin || '';
                showStatus('Loaded PIN from history.', 'info');
            } catch (error) {
                showStatus(`Error loading PIN history: ${error.message}`, 'error');
            }
        }

        async function savePin() {
            const pinValue = (document.getElementById('pinInput').value || '').replace(/\D/g, '');
            document.getElementById('pinInput').value = pinValue;
            try {
                const response = await fetch('/api/pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pinValue })
                });
                if (!response.ok) {
                    throw new Error('Failed to save PIN');
                }
                showStatus('PIN saved in server memory (lost when server restarts).', 'info');
                await loadPin();
            } catch (error) {
                showStatus(`Error saving PIN: ${error.message}`, 'error');
            }
        }

        function renderDevices() {
            const devicesList = document.getElementById('devicesList');
            devicesList.innerHTML = '';

            availableDevices.forEach((device, index) => {
                const card = document.createElement('div');
                card.className = 'device-card';
                if (selectedDevices.includes(device)) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div class="device-icon">
                        <i class="fa-solid fa-mobile"></i>
                        ${selectedDevices.includes(device) ? `<div style="position: absolute; top: 5px; right: 5px; background: #4CAF50; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;">${selectedDevices.indexOf(device) + 1}</div>` : ''}
                    </div>
                    <div class="device-info">
                        <div class="device-name">${device.substring(0, 15)}</div>
                        <div class="device-id">${device}</div>
                    </div>
                `;

                card.addEventListener('click', () => toggleDevice(device, card));
                devicesList.appendChild(card);
            });

            updateConnectButton();
        }

        function toggleDevice(udid, cardElement) {
            if (selectedDevices.includes(udid)) {
                selectedDevices = selectedDevices.filter(d => d !== udid);
                cardElement.classList.remove('selected');
            } else {
                if (selectedDevices.length < 3) {
                    selectedDevices.push(udid);
                    cardElement.classList.add('selected');
                } else {
                    alert('Maximum 3 devices can be selected. Please deselect one device first.');
                    return;
                }
            }
            renderDevices();
        }

        function updateConnectButton() {
            const connectBtn = document.getElementById('connectBtn');
            connectBtn.disabled = selectedDevices.length === 0;
            
            if (selectedDevices.length === 1) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect (Single)';
            } else if (selectedDevices.length === 2) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect (Dual)';
            } else if (selectedDevices.length === 3) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect (Multi)';
            } else {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect';
            }
        }

        function connectToDevice() {
            if (selectedDevices.length === 0) {
                alert('Please select at least one device');
                return;
            }

            if (selectedDevices.length === 1) {
                window.location.href = `/stream-single?device=${encodeURIComponent(selectedDevices[0])}`;
            } else if (selectedDevices.length === 2) {
                window.location.href = `/stream-multi?device1=${encodeURIComponent(selectedDevices[0])}&device2=${encodeURIComponent(selectedDevices[1])}`;
            } else if (selectedDevices.length === 3) {
                window.location.href = `/stream-multi?device1=${encodeURIComponent(selectedDevices[0])}&device2=${encodeURIComponent(selectedDevices[1])}&device3=${encodeURIComponent(selectedDevices[2])}`;
            }
        }

        // Auto-scan on page load
        scanDevices();
        loadPin();

        document.getElementById('pinInput').addEventListener('input', () => {
            if (pinSaveTimer) {
                clearTimeout(pinSaveTimer);
            }
            pinSaveTimer = setTimeout(savePin, 250);
        });

        // Scan every 5 seconds
        setInterval(scanDevices, 5000);
    </script>
</body>

</html>
