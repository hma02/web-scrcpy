<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Select Device - Web Scrcpy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-y: auto;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px 14px;
        }

        .selector-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 24px;
            max-width: 600px;
            width: 100%;
            margin: 8px 0 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .devices-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            min-height: 120px;
            max-height: 38vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        .device-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            line-height: 1.25;
        }

        .device-card:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .device-card.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #764ba2;
            color: white;
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            white-space: nowrap;
        }

        .device-mainline {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-card.selected .device-mainline {
            color: white;
        }

        .device-age {
            color: #666;
            font-size: 12px;
            margin-left: auto;
        }

        .device-card.selected .device-age {
            color: #e0e0e0;
        }

        .power-save-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .power-save-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #555;
            font-size: 12px;
        }

        .power-save-input {
            width: 84px;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .status {
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background-color: #ffebee;
            color: #c62828;
        }

        .status.info {
            background-color: #f3e5f5;
            color: #6a1b9a;
        }

        .status i {
            margin-right: 8px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .pin-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            align-items: center;
        }

        .pin-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #5568d3;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .btn-pin-saved {
            background-color: #2e7d32;
            color: #fff;
        }

        .btn-pin-saved:hover {
            background-color: #256628;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="selector-box">
            <div class="header">
                <h1>📱 Select Device</h1>
                <p>Choose one or more devices to begin streaming</p>
            </div>

            <div class="status loading show" id="status">
                <span class="spinner"></span>
                <span id="statusText">Scanning for devices...</span>
            </div>

            <div class="devices-grid" id="devicesList">
                <!-- Devices will be populated here -->
            </div>

            <div class="pin-row">
                <input id="pinInput" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Memorized PIN">
                <button id="savePinBtn" class="btn btn-secondary" onclick="savePin()">
                    <i class="fa-solid fa-key"></i> SAVE PIN
                </button>
            </div>

            <div class="power-save-row">
                <label class="power-save-field">
                    Power save start hour
                    <input id="powerSaveStart" class="power-save-input" type="number" min="0" max="23" step="1">
                </label>
                <label class="power-save-field">
                    Power save end hour
                    <input id="powerSaveEnd" class="power-save-input" type="number" min="0" max="23" step="1">
                </label>
                <button id="savePowerSaveBtn" class="btn btn-secondary" onclick="savePowerSaveConfig()">
                    <i class="fa-solid fa-moon"></i> Apply window
                </button>
                <span id="powerSaveCurrentHour" class="power-save-field">current_hour: unknown</span>
                <button id="videoOverrideBtn" class="btn btn-secondary" onclick="toggleVideoEnabledOverride()">
                    <i class="fa-solid fa-video-slash"></i> Override video: Off
                </button>
                <span id="videoEnabledStatus" class="power-save-field">video_enabled: unknown</span>
            </div>

            <div class="buttons">
                <button class="btn btn-secondary" onclick="scanDevices()">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
                <button class="btn btn-primary" id="connectBtn" onclick="connectToDevice()" disabled>
                    <i class="fa-solid fa-play"></i> Connect
                </button>
            </div>
        </div>
    </div>

    <script>
        let availableDevices = [];
        let selectedDevices = [];
        let savedPinValue = '';
        let savedPowerSaveConfig = null;
        let videoEnabledOverride = null;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            status.className = `status show ${type}`;

            if (type === 'loading') {
                statusText.innerHTML = `<span class="spinner"></span>${message}`;
            } else {
                const icons = {
                    error: 'fa-circle-exclamation',
                    info: 'fa-circle-info'
                };
                statusText.innerHTML = `<i class="fa-solid ${icons[type]}"></i>${message}`;
            }
        }

        function formatDuration(seconds) {
            if (seconds >= 3600) {
                return `${(seconds / 3600).toFixed(2)}h`;
            }
            return `${(seconds / 60).toFixed(2)}m`;
        }

        async function scanDevices() {
            showStatus('Scanning for devices...', 'loading');
            try {
                const response = await fetch('/api/devices');
                availableDevices = await response.json();

                if (availableDevices.length === 0) {
                    showStatus('No devices found. Please connect an Android device via USB.', 'error');
                    return;
                }

                if (availableDevices.length === 1) {
                    showStatus(`Found ${availableDevices.length} device. Select it to begin streaming.`, 'info');
                } else {
                    showStatus(`Found ${availableDevices.length} devices. Select up to 4 devices to stream.`, 'info');
                }

                renderDevices();
            } catch (error) {
                showStatus(`Error scanning devices: ${error.message}`, 'error');
                console.error('Scan error:', error);
            }
        }

        function clampHourInput(input) {
            let value = parseInt(input.value || '0', 10);
            if (isNaN(value)) value = 0;
            value = Math.min(23, Math.max(0, value));
            input.value = value;
            return value;
        }

        function updatePowerSaveStatus(data) {
            videoEnabledOverride = data.video_enabled_override;
            window.latestPowerSaveVideoEnabled = Boolean(data.video_enabled);
            document.getElementById('videoEnabledStatus').textContent =
                `video_enabled: ${Boolean(data.video_enabled)}; override: ${data.video_override_mode ?? 'auto'}`;
            document.getElementById('powerSaveCurrentHour').textContent =
                `current_hour: ${data.current_hour ?? 'unknown'} (${data.timezone ?? 'unknown'})`;
            const overrideBtn = document.getElementById('videoOverrideBtn');
            overrideBtn.innerHTML = Boolean(data.video_enabled)
                ? '<i class="fa-solid fa-video-slash"></i> Override video: Off'
                : '<i class="fa-solid fa-video"></i> Override video: On';
        }

        async function loadPowerSaveConfig() {
            try {
                const response = await fetch('/api/power_save', { cache: 'no-store' });
                const data = await response.json();
                document.getElementById('powerSaveStart').value = data.start_hour;
                document.getElementById('powerSaveEnd').value = data.end_hour;
                savedPowerSaveConfig = { start_hour: data.start_hour, end_hour: data.end_hour };
                updatePowerSaveStatus(data);
            } catch (error) {
                console.error('Load power-save config error:', error);
            }
        }

        async function savePowerSaveConfig() {
            const startHour = clampHourInput(document.getElementById('powerSaveStart'));
            const endHour = clampHourInput(document.getElementById('powerSaveEnd'));
            try {
                const response = await fetch('/api/power_save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start_hour: startHour, end_hour: endHour })
                });
                if (!response.ok) throw new Error('Failed to update power-save window');
                const data = await response.json();
                savedPowerSaveConfig = { start_hour: startHour, end_hour: endHour };
                updatePowerSaveStatus(data);
                showStatus(`Power-save window updated to ${startHour}:00–${endHour}:00 (video_enabled: ${Boolean(data.video_enabled)}). Refreshing...`, 'info');
                setTimeout(() => window.location.reload(), 500);
            } catch (error) {
                showStatus(`Error saving power-save window: ${error.message}`, 'error');
            }
        }

        async function toggleVideoEnabledOverride() {
            try {
                const nextOverride = !Boolean(window.latestPowerSaveVideoEnabled);
                const response = await fetch('/api/power_save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_enabled_override: nextOverride })
                });
                if (!response.ok) throw new Error('Failed to update video override');
                const data = await response.json();
                updatePowerSaveStatus(data);
                showStatus(`Video override set ${nextOverride ? 'on' : 'off'}. Refreshing...`, 'info');
                setTimeout(() => window.location.reload(), 500);
            } catch (error) {
                showStatus(`Error updating video override: ${error.message}`, 'error');
            }
        }

        async function loadPin() {
            try {
                const response = await fetch('/api/pin');
                const data = await response.json();
                const pinInput = document.getElementById('pinInput');
                pinInput.value = data.pin || '';
                savedPinValue = data.pin || '';
                updateSavePinButtonState();
            } catch (error) {
                console.error('Load PIN error:', error);
            }
        }

        function updateSavePinButtonState() {
            const saveBtn = document.getElementById('savePinBtn');
            const pinValue = (document.getElementById('pinInput').value || '').replace(/\D/g, '');
            const isSaved = pinValue.length > 0 && pinValue === savedPinValue;
            saveBtn.classList.toggle('btn-pin-saved', isSaved);
            saveBtn.innerHTML = isSaved
                ? '<i class="fa-solid fa-check"></i> Saved'
                : '<i class="fa-solid fa-key"></i> SAVE PIN';
        }

        async function savePin() {
            const pinInput = document.getElementById('pinInput');
            const pinValue = (pinInput.value || '').replace(/\D/g, '');
            pinInput.value = pinValue;
            try {
                const response = await fetch('/api/pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pinValue })
                });
                if (!response.ok) {
                    throw new Error('Failed to save PIN');
                }
                savedPinValue = pinValue;
                updateSavePinButtonState();
                showStatus('PIN saved in server memory (lost when server restarts).', 'info');
            } catch (error) {
                showStatus(`Error saving PIN: ${error.message}`, 'error');
            }
        }

        function renderDevices() {
            const devicesList = document.getElementById('devicesList');
            devicesList.innerHTML = '';

            availableDevices.forEach((device) => {
                const udid = typeof device === 'string' ? device : device.udid;
                const durationText = typeof device === 'object'
                    ? formatDuration(Number(device.alive_for_seconds || 0))
                    : '';

                const card = document.createElement('div');
                card.className = 'device-card';
                if (selectedDevices.includes(udid)) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div class="device-info">
                        <div class="device-mainline">📱 ${udid}</div>
                        <div class="device-age">${durationText}</div>
                    </div>
                `;

                card.addEventListener('click', () => toggleDevice(udid));
                devicesList.appendChild(card);
            });

            updateConnectButton();
        }

        function toggleDevice(udid) {
            if (selectedDevices.includes(udid)) {
                selectedDevices = selectedDevices.filter(d => d !== udid);
            } else {
                if (selectedDevices.length < 4) {
                    selectedDevices.push(udid);
                } else {
                    alert('Maximum 4 devices can be selected. Please deselect one device first.');
                    return;
                }
            }
            renderDevices();
        }

        function updateConnectButton() {
            const connectBtn = document.getElementById('connectBtn');
            connectBtn.disabled = selectedDevices.length === 0;

            if (selectedDevices.length === 1) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect';
            } else if (selectedDevices.length === 2) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect (Dual)';
            } else if (selectedDevices.length === 3) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect (Multi)';
            } else if (selectedDevices.length === 4) {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect (4 Devices)';
            } else {
                connectBtn.innerHTML = '<i class="fa-solid fa-play"></i> Connect';
            }
        }

        function connectToDevice() {
            if (selectedDevices.length === 0) {
                alert('Please select at least one device');
                return;
            }

            const params = selectedDevices
                .map((udid, idx) => `device${idx + 1}=${encodeURIComponent(udid)}`)
                .join('&');
            window.location.href = `/stream-multi?${params}`;
        }

        scanDevices();
        loadPin();
        loadPowerSaveConfig();

        document.getElementById('pinInput').addEventListener('input', () => {
            const pinInput = document.getElementById('pinInput');
            pinInput.value = (pinInput.value || '').replace(/\D/g, '');
            updateSavePinButtonState();
        });

        setInterval(scanDevices, 5000);
    </script>
</body>

</html>
