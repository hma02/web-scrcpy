<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Device Stream - Web Scrcpy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #222;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 1px solid #444;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .device-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4caf50;
        }

        .device-indicator.loading {
            background-color: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-header {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background-color: #444;
            color: white;
            transition: background-color 0.3s;
        }

        .btn-header:hover {
            background-color: #555;
        }

        .settings-panel {
            position: absolute;
            right: 12px;
            top: 58px;
            width: min(360px, calc(100vw - 24px));
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px;
            z-index: 20;
            display: none;
        }

        .settings-panel.visible {
            display: block;
        }

        .settings-panel textarea {
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px;
            font-size: 12px;
            width: 100%;
            margin-top: 8px;
            min-height: 70px;
        }

        .settings-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .status-text {
            margin-top: 8px;
            color: #aaa;
            font-size: 12px;
            min-height: 16px;
        }

        .video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: black;
        }

        .controls-bar {
            display: flex;
            gap: 5px;
            padding: 8px 20px;
            background-color: #222;
            border-top: 1px solid #444;
            flex-wrap: wrap;
        }

        .control-icon {
            flex: 1;
            min-width: 50px;
            padding: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #eee;
            border: 1px solid #444;
            border-radius: 3px;
            text-align: center;
            transition: all 0.2s;
            background-color: #333;
        }

        .control-icon:hover {
            background-color: #444;
            color: #007BFF;
        }
    </style>
    <script src="/static/js/socket.io.js"></script>
    <script src="/static/js/input.js"></script>
    <script src="/static/js/exp-golomb.js"></script>
    <script src="/static/js/h264-sps-parser.js"></script>
    <script src="/static/js/video_parser.js"></script>
    <script src="/static/js/jmuxer.min.js"></script>
</head>

<body>
    <div class="header">
        <div class="device-header">
            <span class="device-indicator loading" id="indicator"></span>
            <span id="deviceName">Device: Loading...</span>
        </div>
        <div class="header-right">
            <button class="btn-header" onclick="toggleSettings()">⚙ Stream Settings</button>
            <button class="btn-header" onclick="goBack()">← Back</button>
        </div>
    </div>

        <div class="video-container">
        <div class="settings-panel" id="settingsPanel">
            <strong style="color:#fff;font-size:13px;">Device controls</strong>
            <textarea id="deviceTextInput" placeholder="Type text for clipboard or 'send as keys'"></textarea>
            <div class="settings-actions">
                <button class="btn-header" onclick="setScreenPowerMode(false)">Screen OFF (keep stream)</button>
                <button class="btn-header" onclick="setScreenPowerMode(true)">Screen ON</button>
                <button class="btn-header" onclick="sendClipboardToDevice()">Set clipboard</button>
                <button class="btn-header" onclick="requestClipboardFromDevice()">Get clipboard</button>
                <button class="btn-header" onclick="sendTextAsKeys()">Send as keys</button>
            </div>
            <div id="settingsStatus" class="status-text"></div>
        </div>
        <video id="player" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
    </div>

    <div class="controls-bar">
        <button class="control-icon" title="Power" onclick="sendControl('power')">
            <i class="fa-solid fa-power-off"></i>
        </button>
        <button class="control-icon" title="Back" onclick="sendControl('back')">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button class="control-icon" title="Home" onclick="sendControl('home')">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="control-icon" title="Menu" onclick="sendControl('menu')">
            <i class="fa-solid fa-bars"></i>
        </button>
        <button class="control-icon" title="Volume Down" onclick="sendControl('vol-down')">
            <i class="fa-solid fa-volume-down"></i>
        </button>
        <button class="control-icon" title="Volume Up" onclick="sendControl('vol-up')">
            <i class="fa-solid fa-volume-up"></i>
        </button>
    </div>

    <script>
        // Get device UDID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const deviceUdid = urlParams.get('device');

        if (!deviceUdid) {
            alert('Device must be specified');
            window.location.href = '/';
        }

        document.getElementById('deviceName').textContent = `Device: ${deviceUdid}`;

        // Setup video player
        const muxer = new JMuxer({
            node: 'player',
            mode: 'video',
            flushingTime: 0,
            fps: 60,
            clearBuffer: true,
            onReady: () => {
                console.log('MSE ready');
                const videoElement = document.getElementById('player');
                if (videoElement) {
                    videoElement.controls = false;
                    videoElement.style.cssText = `
                        -webkit-media-controls: none !important;
                        -webkit-media-controls-enclosure: none !important;
                        -webkit-media-controls-panel: none !important;
                    `;
                }
            },
            onError: (err) => {
                console.error('MSE Error:', err);
            }
        });

        let input = null;
        let pendingDefaultScreenOff = true;

        const parser = new VideoParser(({ type, data }) => {
            if (type === 'nalu') {
                muxer.feed({ video: data });
            } else if (type === 'init') {
                muxer.feed({ video: data["sps"] });
                muxer.feed({ video: data["pps"] });
            } else if (type === 'screen_size') {
                initInput(data["width"], data["height"]);
            } else if (type === 'size_change') {
                if (input) {
                    input.resizeScreen(data["width"], data["height"]);
                }
            }
        });

        function initInput(width, height) {
            function input_data_cb(data) {
                socket.emit('control_data', {
                    device_udid: deviceUdid,
                    data: data
                });
            }

            const videoElement = document.getElementById('player');
            input = new ScrcpyInput(input_data_cb, videoElement, width, height, false);
            if (pendingDefaultScreenOff) {
                setTimeout(() => {
                    setScreenPowerMode(false);
                }, 250);
            }
        }

        function injectKeyCode(keyCode, action) {
            if (!input) return;
            try {
                // Create binary protocol data for key injection
                const data = input.createKeyProtocolData(action, keyCode, 0, 0);
                socket.emit('control_data', {
                    device_udid: deviceUdid,
                    data: data
                });
            } catch (e) {
                console.error('Error injecting key code:', e);
            }
        }

        function sendControl(action) {
            if (!input) return;

            const keyCodeMap = {
                'power': () => { input.screen_on_off(0); setTimeout(() => input.screen_on_off(1), 100); },
                'vol-down': () => { injectKeyCode(25, 0); setTimeout(() => injectKeyCode(25, 1), 100); },
                'vol-up': () => { injectKeyCode(24, 0); setTimeout(() => injectKeyCode(24, 1), 100); },
                'back': () => { injectKeyCode(4, 0); setTimeout(() => injectKeyCode(4, 1), 100); },
                'home': () => { injectKeyCode(3, 0); setTimeout(() => injectKeyCode(3, 1), 100); },
                'menu': () => { injectKeyCode(187, 0); setTimeout(() => injectKeyCode(187, 1), 100); }
            };

            if (keyCodeMap[action]) {
                keyCodeMap[action]();
            }
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('visible');
        }

        function setScreenPowerMode(screenPowerOn) {
            if (!input) return;
            input.set_screen_power_mode(screenPowerOn);
            pendingDefaultScreenOff = false;
            document.getElementById('settingsStatus').textContent = screenPowerOn
                ? 'Requested screen power mode: ON'
                : 'Requested screen power mode: OFF (stream should remain active)';
        }

        function sendClipboardToDevice() {
            if (!input) return;
            const text = document.getElementById('deviceTextInput').value || '';
            const data = input.createSetClipboardControlMessage(text, false);
            socket.emit('control_data', { device_udid: deviceUdid, data });
            document.getElementById('settingsStatus').textContent = 'Clipboard text sent to device.';
        }

        function requestClipboardFromDevice() {
            if (!input) return;
            const data = input.createGetClipboardControlMessage();
            socket.emit('control_data', { device_udid: deviceUdid, data });
            document.getElementById('settingsStatus').textContent = 'Requested clipboard from device...';
        }

        function sendTextAsKeys() {
            if (!input) return;
            const text = document.getElementById('deviceTextInput').value || '';
            if (!text) return;
            const data = input.createTextControlMessage(text);
            socket.emit('control_data', { device_udid: deviceUdid, data });
            document.getElementById('settingsStatus').textContent = 'Text sent as key input.';
        }

        const socket = io({
            reconnection: true,
            autoConnect: true
        });

        socket.on('video_data', (data) => {
            if (data.device_udid === deviceUdid) {
                const newData = new Uint8Array(data.data);
                parser.appendData(newData);
            }
        });

        socket.on('connect', () => {
            console.log('Connected to server, starting device...');
            socket.emit('start_device', { device_udid: deviceUdid });
        });

        socket.on('device_started', (data) => {
            if (data.device_udid === deviceUdid) {
                document.getElementById('indicator').classList.remove('loading');
                console.log('Device started');
            }
        });

        socket.on('error', (error) => {
            console.error('Socket error:', error);
        });

        socket.on('device_message', async (payload) => {
            if (!payload || payload.device_udid !== deviceUdid) return;
            const message = payload.message || {};
            if (message.type === 'clipboard') {
                const text = message.text || '';
                document.getElementById('deviceTextInput').value = text;
                document.getElementById('settingsStatus').textContent = 'Clipboard received from device.';
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch (e) {
                        console.debug('Clipboard write failed:', e);
                    }
                }
            }
        });

        socket.on('disconnect', () => {
            document.getElementById('indicator').classList.add('loading');
            pendingDefaultScreenOff = true;
            console.log('Disconnected from server');
        });

        function goBack() {
            if (confirm('Stop streaming and go back?')) {
                socket.emit('stop_device', { device_udid: deviceUdid });
                socket.disconnect();
                window.location.href = '/';
            }
        }

        window.addEventListener('beforeunload', () => {
            socket.emit('stop_device', { device_udid: deviceUdid });
            socket.disconnect();
        });
    </script>
</body>

</html>
