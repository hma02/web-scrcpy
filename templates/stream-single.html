<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Device Stream - Web Scrcpy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #222;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 1px solid #444;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .device-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4caf50;
        }

        .device-indicator.loading {
            background-color: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-header {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background-color: #444;
            color: white;
            transition: background-color 0.3s;
        }

        .btn-header:hover {
            background-color: #555;
        }

        .settings-panel {
            position: absolute;
            right: 12px;
            top: 58px;
            width: min(360px, calc(100vw - 24px));
            max-height: calc(100vh - 80px);
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px;
            z-index: 20;
            display: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .settings-panel.visible {
            display: block;
        }

        .settings-panel textarea {
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px;
            font-size: 12px;
            width: 100%;
            margin-top: 8px;
            min-height: 70px;
        }

        .settings-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .status-text {
            margin-top: 8px;
            color: #aaa;
            font-size: 12px;
            min-height: 16px;
        }

        .stalled-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
        }

        .stalled-overlay.visible {
            display: flex;
        }

        .stalled-box {
            background: #1e1e1e;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 16px;
            color: #fff;
            width: min(420px, calc(100vw - 32px));
        }

        .stalled-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: black;
        }

        .controls-bar {
            display: flex;
            gap: 5px;
            padding: 8px 20px;
            background-color: #222;
            border-top: 1px solid #444;
            flex-wrap: wrap;
        }

        .debug-status {
            padding: 6px 20px;
            background: #111;
            border-top: 1px solid #333;
            color: #9ad;
            font-size: 12px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .control-icon {
            flex: 1;
            min-width: 50px;
            padding: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #eee;
            border: 1px solid #444;
            border-radius: 3px;
            text-align: center;
            transition: all 0.2s;
            background-color: #333;
        }

        .control-icon:hover {
            background-color: #444;
            color: #007BFF;
        }
    </style>
    <script src="/static/js/socket.io.js"></script>
    <script src="/static/js/input.js"></script>
    <script src="/static/js/exp-golomb.js"></script>
    <script src="/static/js/h264-sps-parser.js"></script>
    <script src="/static/js/video_parser.js"></script>
    <script src="/static/js/jmuxer.min.js"></script>
</head>

<body>
    <div class="header">
        <div class="device-header">
            <span class="device-indicator loading" id="indicator"></span>
            <span id="deviceName">Device: Loading...</span>
        </div>
        <div class="header-right">
            <button class="btn-header" onclick="toggleSettings()">⚙ Stream Settings</button>
            <button class="btn-header" onclick="goBack()">← Back</button>
        </div>
    </div>

        <div class="video-container">
        <div class="settings-panel" id="settingsPanel">
            <strong style="color:#fff;font-size:13px;">Device controls</strong>
            <textarea id="deviceTextInput" placeholder="Type text for clipboard or 'send as keys'"></textarea>
            <div class="settings-actions">
                <button class="btn-header" id="screenPowerToggleBtn" onclick="toggleScreenPowerMode()">Screen OFF (keep stream)</button>
                <button class="btn-header" onclick="sendClipboardToDevice()">Set clipboard</button>
                <button class="btn-header" onclick="requestClipboardFromDevice()">Get clipboard</button>
                <button class="btn-header" onclick="sendTextAsKeys()">Send as keys</button>
                <button class="btn-header" onclick="swipeUpPinAndOk()">Swipe Up -> Send Pin -> Send OK</button>
            </div>
            <div id="settingsStatus" class="status-text"></div>
        </div>
        <div id="stalledOverlay" class="stalled-overlay">
            <div class="stalled-box">
                <strong>Stream appears stalled</strong>
                <p style="margin-top:8px;font-size:13px;color:#ddd;">
                    No video frames have been received for a while. Reconnect this device stream?
                </p>
                <div class="stalled-actions">
                    <button class="btn-header" onclick="reconnectStream()">Reconnect</button>
                    <button class="btn-header" onclick="dismissStalledOverlay()">Keep waiting</button>
                </div>
            </div>
        </div>
        <video id="player" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
    </div>

    <div class="controls-bar">
        <button class="control-icon" title="Power" onclick="sendControl('power')">
            <i class="fa-solid fa-power-off"></i>
        </button>
        <button class="control-icon" title="Back" onclick="sendControl('back')">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button class="control-icon" title="Home" onclick="sendControl('home')">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="control-icon" title="Menu" onclick="sendControl('menu')">
            <i class="fa-solid fa-bars"></i>
        </button>
        <button class="control-icon" title="Volume Down" onclick="sendControl('vol-down')">
            <i class="fa-solid fa-volume-down"></i>
        </button>
        <button class="control-icon" title="Volume Up" onclick="sendControl('vol-up')">
            <i class="fa-solid fa-volume-up"></i>
        </button>
        <button class="control-icon" title="Confirm (OK)" onclick="sendControl('confirm')">
            <i class="fa-solid fa-check"></i>
        </button>
    </div>
    <div id="debugStatus" class="debug-status"></div>

    <script>
        // Get device UDID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const deviceUdid = urlParams.get('device');

        if (!deviceUdid) {
            alert('Device must be specified');
            window.location.href = '/';
        }

        document.getElementById('deviceName').textContent = `Device: ${deviceUdid}`;

        // Setup video player
        const muxer = new JMuxer({
            node: 'player',
            mode: 'video',
            flushingTime: 0,
            fps: 60,
            clearBuffer: true,
            onReady: () => {
                console.log('MSE ready');
                const videoElement = document.getElementById('player');
                if (videoElement) {
                    videoElement.controls = false;
                    videoElement.style.cssText = `
                        -webkit-media-controls: none !important;
                        -webkit-media-controls-enclosure: none !important;
                        -webkit-media-controls-panel: none !important;
                    `;
                }
            },
            onError: (err) => {
                console.error('MSE Error:', err);
            }
        });

        let input = null;
        let pendingDefaultScreenOff = true;
        let screenPowerOn = false;
        let lastVideoDataAt = Date.now();
        let stallPromptShown = false;
        let awaitingClipboard = false;
        let autoResumeInProgress = false;
        let streamState = 'stopped-streaming';
        let reconnectPromptTimer = null;
        let reconnectPromptDeadline = null;
        const parser = new VideoParser(({ type, data }) => {
            if (type === 'nalu') {
                muxer.feed({ video: data });
            } else if (type === 'init') {
                muxer.feed({ video: data["sps"] });
                muxer.feed({ video: data["pps"] });
            } else if (type === 'screen_size') {
                initInput(data["width"], data["height"]);
            } else if (type === 'size_change') {
                if (input) {
                    input.resizeScreen(data["width"], data["height"]);
                }
            }
        });

        function initInput(width, height) {
            function input_data_cb(data) {
                socket.emit('control_data', {
                    device_udid: deviceUdid,
                    data: data
                });
            }

            const videoElement = document.getElementById('player');
            input = new ScrcpyInput(input_data_cb, videoElement, width, height, false);
            if (pendingDefaultScreenOff) {
                setTimeout(() => {
                    setScreenPowerMode(false);
                }, 250);
            }
        }

        function injectKeyCode(keyCode, action) {
            if (!input) return;
            try {
                // Create binary protocol data for key injection
                const data = input.createKeyProtocolData(action, keyCode, 0, 0);
                socket.emit('control_data', {
                    device_udid: deviceUdid,
                    data: data
                });
            } catch (e) {
                console.error('Error injecting key code:', e);
            }
        }

        function sendControl(action) {
            if (!input) return;

            const keyCodeMap = {
                // Use KEYCODE_POWER (26). screen_on_off() can act like Back when display is already on.
                'power': () => { injectKeyCode(26, 0); setTimeout(() => injectKeyCode(26, 1), 100); },
                'confirm': () => { injectKeyCode(66, 0); setTimeout(() => injectKeyCode(66, 1), 100); },
                'vol-down': () => { injectKeyCode(25, 0); setTimeout(() => injectKeyCode(25, 1), 100); },
                'vol-up': () => { injectKeyCode(24, 0); setTimeout(() => injectKeyCode(24, 1), 100); },
                'back': () => { injectKeyCode(4, 0); setTimeout(() => injectKeyCode(4, 1), 100); },
                'home': () => { injectKeyCode(3, 0); setTimeout(() => injectKeyCode(3, 1), 100); },
                'menu': () => { injectKeyCode(187, 0); setTimeout(() => injectKeyCode(187, 1), 100); }
            };

            if (keyCodeMap[action]) {
                keyCodeMap[action]();
            }
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('visible');
        }

        function setScreenPowerMode(isOn) {
            if (!input) return;
            input.set_screen_power_mode(isOn);
            pendingDefaultScreenOff = false;
            screenPowerOn = isOn;
            document.getElementById('screenPowerToggleBtn').textContent = screenPowerOn ? 'Screen ON' : 'Screen OFF (keep stream)';
            document.getElementById('settingsStatus').textContent = screenPowerOn
                ? 'Requested screen power mode: ON'
                : 'Requested screen power mode: OFF (stream should remain active)';
        }

        function toggleScreenPowerMode() {
            setScreenPowerMode(!screenPowerOn);
        }

        function sendClipboardToDevice() {
            if (!input) return;
            const text = document.getElementById('deviceTextInput').value || '';
            const data = input.createSetClipboardControlMessage(text, false);
            socket.emit('control_data', { device_udid: deviceUdid, data });
            document.getElementById('settingsStatus').textContent = 'Clipboard text sent to device.';
        }

        function requestClipboardFromDevice() {
            if (!input) return;
            const data = input.createGetClipboardControlMessage();
            socket.emit('control_data', { device_udid: deviceUdid, data });
            awaitingClipboard = true;
            document.getElementById('settingsStatus').textContent = 'Requested clipboard from device...';
        }

        function sendTextAsKeys() {
            if (!input) return;
            const text = document.getElementById('deviceTextInput').value || '';
            if (!text) return;
            const data = input.createTextControlMessage(text);
            socket.emit('control_data', { device_udid: deviceUdid, data });
            document.getElementById('settingsStatus').textContent = 'Text sent as key input.';
        }

        function sendSwipeUpGesture() {
            if (!input) return;
            const x = Math.floor(input.width * 0.5);
            const yStart = Math.floor(input.height * 0.82);
            const yEnd = Math.floor(input.height * 0.2);
            const frames = 6;
            const pressure = 65535;

            const down = input.createTouchProtocolData(0, x, yStart, input.width, input.height, 0, 0, pressure);
            socket.emit('control_data', { device_udid: deviceUdid, data: down });

            for (let i = 1; i < frames; i++) {
                const y = Math.floor(yStart - ((yStart - yEnd) * i / frames));
                setTimeout(() => {
                    const move = input.createTouchProtocolData(2, x, y, input.width, input.height, 0, 0, pressure);
                    socket.emit('control_data', { device_udid: deviceUdid, data: move });
                }, i * 20);
            }

            setTimeout(() => {
                const up = input.createTouchProtocolData(1, x, yEnd, input.width, input.height, 0, 0, 0);
                socket.emit('control_data', { device_udid: deviceUdid, data: up });
            }, frames * 20 + 20);
        }

        async function swipeUpPinAndOk() {
            if (!input) return;
            try {
                const response = await fetch('/api/pin');
                const payload = await response.json();
                const pin = payload.pin || '';
                if (!pin) {
                    document.getElementById('settingsStatus').textContent = 'No memorized PIN found. Set it on the selection page first.';
                    return;
                }
                sendSwipeUpGesture();
                setTimeout(() => {
                    const data = input.createTextControlMessage(pin);
                    socket.emit('control_data', { device_udid: deviceUdid, data });
                    setTimeout(() => {
                        injectKeyCode(66, 0);
                        setTimeout(() => injectKeyCode(66, 1), 80);
                    }, 120);
                }, 280);
                document.getElementById('settingsStatus').textContent = 'Swipe up + memorized PIN + OK sent.';
            } catch (error) {
                document.getElementById('settingsStatus').textContent = `Failed to load PIN: ${error.message}`;
            }
        }

        const socket = io({
            reconnection: true,
            autoConnect: true
        });

        socket.on('video_data', (data) => {
            if (data.device_udid === deviceUdid) {
                const newData = new Uint8Array(data.data);
                parser.appendData(newData);
                lastVideoDataAt = Date.now();
                stallPromptShown = false;
                streamState = 'streaming';
                document.getElementById('stalledOverlay').classList.remove('visible');
            }
        });

        socket.on('connect', () => {
            console.log('Connected to server, starting device...');
            socket.emit('start_device', { device_udid: deviceUdid });
        });

        socket.on('device_started', (data) => {
            if (data.device_udid === deviceUdid) {
                document.getElementById('indicator').classList.remove('loading');
                streamState = 'streaming';
                console.log('Device started');
            }
        });

        socket.on('error', (error) => {
            console.error('Socket error:', error);
        });

        socket.on('device_message', async (payload) => {
            if (!payload || payload.device_udid !== deviceUdid) return;
            const message = payload.message || {};
            if (message.type === 'clipboard') {
                const text = message.text || '';
                document.getElementById('deviceTextInput').value = text;
                awaitingClipboard = false;
                document.getElementById('settingsStatus').textContent = `Clipboard received: ${text}`;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch (e) {
                        console.debug('Clipboard write failed:', e);
                    }
                }
            }
        });

        socket.on('disconnect', () => {
            document.getElementById('indicator').classList.add('loading');
            pendingDefaultScreenOff = true;
            stallPromptShown = false;
            streamState = 'stopped-streaming';
            console.log('Disconnected from server');
        });

        function reconnectStream() {
            dismissStalledOverlay();
            streamState = 'stopped-streaming';
            socket.emit('stop_device', { device_udid: deviceUdid });
            setTimeout(() => {
                socket.emit('start_device', { device_udid: deviceUdid });
            }, 300);
        }

        function reconnectStreamAuto(reason) {
            if (autoResumeInProgress) return;
            autoResumeInProgress = true;
            console.log(`Attempting auto-resume reconnect (${reason})...`);
            streamState = 'stopped-streaming';
            socket.emit('stop_device', { device_udid: deviceUdid });
            setTimeout(() => {
                socket.emit('start_device', { device_udid: deviceUdid });
                setTimeout(() => {
                    autoResumeInProgress = false;
                }, 2000);
            }, 300);
        }

        function dismissStalledOverlay() {
            if (reconnectPromptTimer) {
                clearTimeout(reconnectPromptTimer);
                reconnectPromptTimer = null;
            }
            reconnectPromptDeadline = null;
            document.getElementById('stalledOverlay').classList.remove('visible');
            stallPromptShown = false;
            lastVideoDataAt = Date.now();
        }

        function showStalledOverlayWithAutoReconnect() {
            const popupTimeoutMs = 5000;
            document.getElementById('stalledOverlay').classList.add('visible');
            stallPromptShown = true;
            streamState = 'stopped-streaming';
            reconnectPromptDeadline = Date.now() + popupTimeoutMs;
            if (reconnectPromptTimer) {
                clearTimeout(reconnectPromptTimer);
            }
            reconnectPromptTimer = setTimeout(() => {
                reconnectPromptTimer = null;
                reconnectPromptDeadline = null;
                reconnectStream();
            }, popupTimeoutMs);
        }

        setInterval(() => {
            const stalledThresholdMs = 5000;
            if (!socket.connected || !deviceUdid) return;
            if (Date.now() - lastVideoDataAt > stalledThresholdMs && !stallPromptShown) {
                showStalledOverlayWithAutoReconnect();
            }
            if (awaitingClipboard && Date.now() - lastVideoDataAt > 120000) {
                awaitingClipboard = false;
            }
        }, 5000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') {
                return;
            }
            const lastSeen = lastVideoDataAt;
            setTimeout(() => {
                if (!socket.connected || !deviceUdid) return;
                const staleMs = Date.now() - lastVideoDataAt;
                const noNewFramesAfterVisible = lastVideoDataAt === lastSeen;
                if (noNewFramesAfterVisible && staleMs > 5000) {
                    reconnectStreamAuto('tab-visible-no-frames');
                }
            }, 2500);
        });

        function updateDebugStatus() {
            const attention = document.visibilityState === 'visible' ? 'on' : 'off';
            const connected = socket.connected ? 'connected' : 'disconnected';
            const secondsSinceFrame = ((Date.now() - lastVideoDataAt) / 1000).toFixed(1);
            const line = [
                `stream=${streamState}`,
                `attention=${attention}`,
                `socket=${connected}`,
                `last_frame_age_s=${secondsSinceFrame}`,
                `stall_prompt=${stallPromptShown ? 'on' : 'off'}`,
                `popup_eta_s=${reconnectPromptDeadline ? Math.max(0, ((reconnectPromptDeadline - Date.now()) / 1000)).toFixed(1) : '-'}`,
                `auto_resume=${autoResumeInProgress ? 'running' : 'idle'}`,
                `screen_power=${screenPowerOn ? 'on' : 'off'}`,
                `awaiting_clipboard=${awaitingClipboard ? 'yes' : 'no'}`
            ].join(' | ');
            document.getElementById('debugStatus').textContent = line;
        }

        setInterval(updateDebugStatus, 500);
        updateDebugStatus();

        function goBack() {
            if (confirm('Stop streaming and go back?')) {
                socket.emit('stop_device', { device_udid: deviceUdid });
                socket.disconnect();
                window.location.href = '/';
            }
        }

        window.addEventListener('beforeunload', () => {
            socket.emit('stop_device', { device_udid: deviceUdid });
            socket.disconnect();
        });
    </script>
</body>

</html>
