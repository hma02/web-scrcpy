<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Dual Device Stream - Web Scrcpy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            background-color: #222;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 60px;
            padding-left: 10px;
            padding-right: 10px;
            gap: 10px;
            transition: left 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            position: fixed;
            left: -220px;
            top: 0;
            width: 220px;
            height: 100vh;
            z-index: 1000;
        }

        .sidebar.expanded {
            left: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .sidebar-toggle {
            width: 40px;
            height: 40px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 1001;
        }

        .sidebar-toggle:hover {
            background-color: #444;
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow-y: auto;
            flex: 1;
        }

        .sidebar.expanded .sidebar-content {
            opacity: 1;
            pointer-events: auto;
        }

        .device-section {
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: white;
        }

        .device-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4caf50;
            flex-shrink: 0;
        }

        .device-indicator.loading {
            background-color: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .device-name {
            font-size: 11px;
            color: #aaa;
            word-break: break-all;
        }

        .sidebar-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .sidebar-button {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .sidebar-button:hover {
            background-color: #444;
        }

        .mini-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .mini-control-group {
            font-size: 10px;
            color: #777;
            margin-bottom: 4px;
        }

        .mini-settings textarea {
            width: 100%;
            background: #262626;
            color: #fff;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 4px;
            font-size: 11px;
            min-height: 56px;
        }

        .mini-control-button {
            width: 100%;
            padding: 6px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s;
            text-align: left;
        }

        .mini-control-button:hover {
            background-color: #444;
        }

        .video-container {
            flex: 1;
            display: flex;
            gap: 2px;
            overflow-y: auto;
            overflow-x: hidden;
            flex-direction: row;
        }

        .stream-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: #000;
            border: 1px solid #333;
            position: relative;
        }

        .stream-header {
            background-color: #222;
            color: #aaa;
            padding: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .stream-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: black;
        }

        .controls-bar {
            display: flex;
            gap: 5px;
            padding: 8px;
            background-color: #222;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        .control-icon {
            flex: 1;
            min-height: 30px;
            padding: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #eee;
            border: 1px solid #333;
            border-radius: 3px;
            text-align: center;
            transition: all 0.2s;
            background-color: #333;
        }

        .control-icon:hover {
            background-color: #444;
            color: #007BFF;
        }

        .controls-label {
            width: 100%;
            font-size: 10px;
            color: #666;
            text-align: center;
            padding: 2px 0 4px 0;
        }

        @media (max-width: 1024px) {
            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: hidden;
            }

            .video-container {
                flex: 1;
                flex-direction: column;
                align-items: stretch;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .stream-panel {
                flex: 0 0 auto;
                width: 100%;
                min-width: unset;
                display: flex;
                flex-direction: column;
                aspect-ratio: 9 / 16;
                min-height: auto;
            }

            .stream-content {
                flex: 1;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
    <script src="/static/js/socket.io.js"></script>
    <script src="/static/js/input.js"></script>
    <script src="/static/js/exp-golomb.js"></script>
    <script src="/static/js/h264-sps-parser.js"></script>
    <script src="/static/js/video_parser.js"></script>
    <script src="/static/js/jmuxer.min.js"></script>
</head>

<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <!-- Back Button at Top -->
            <button class="sidebar-button" onclick="goBack()">← Back to Menu</button>

            <!-- Device 1 Info -->
            <div class="device-section">
                <div class="device-header">
                    <span class="device-indicator loading" id="indicator1"></span>
                    <span class="device-name" id="deviceName1">Device 1</span>
                </div>
                <div class="mini-controls">
                    <div class="mini-control-group">Controls 1</div>
                    <button class="mini-control-button" title="Power" onclick="sendControl(1, 'power')">⏻ Power</button>
                    <button class="mini-control-button" title="Back" onclick="sendControl(1, 'back')">← Back</button>
                    <button class="mini-control-button" title="Home" onclick="sendControl(1, 'home')">⌂ Home</button>
                    <button class="mini-control-button" title="Menu" onclick="sendControl(1, 'menu')">☰ Menu</button>
                    <button class="mini-control-button" title="Volume Down" onclick="sendControl(1, 'vol-down')">🔽 Vol-</button>
                    <button class="mini-control-button" title="Volume Up" onclick="sendControl(1, 'vol-up')">🔼 Vol+</button>
                    <div class="mini-control-group">More 1</div>
                    <div class="mini-settings">
                        <textarea id="text1" placeholder="clipboard / text input"></textarea>
                    </div>
                    <button class="mini-control-button" id="screenToggle1" onclick="toggleScreenPowerMode(1)">Screen OFF keep stream</button>
                    <button class="mini-control-button" onclick="setClipboard(1)">Set clipboard</button>
                    <button class="mini-control-button" onclick="getClipboard(1)">Get clipboard</button>
                    <button class="mini-control-button" onclick="sendTextAsKeys(1)">Send as keys</button>
                </div>
            </div>

            <!-- Device 2 Info -->
            <div class="device-section">
                <div class="device-header">
                    <span class="device-indicator loading" id="indicator2"></span>
                    <span class="device-name" id="deviceName2">Device 2</span>
                </div>
                <div class="mini-controls">
                    <div class="mini-control-group">Controls 2</div>
                    <button class="mini-control-button" title="Power" onclick="sendControl(2, 'power')">⏻ Power</button>
                    <button class="mini-control-button" title="Back" onclick="sendControl(2, 'back')">← Back</button>
                    <button class="mini-control-button" title="Home" onclick="sendControl(2, 'home')">⌂ Home</button>
                    <button class="mini-control-button" title="Menu" onclick="sendControl(2, 'menu')">☰ Menu</button>
                    <button class="mini-control-button" title="Volume Down" onclick="sendControl(2, 'vol-down')">🔽 Vol-</button>
                    <button class="mini-control-button" title="Volume Up" onclick="sendControl(2, 'vol-up')">🔼 Vol+</button>
                    <div class="mini-control-group">More 2</div>
                    <div class="mini-settings">
                        <textarea id="text2" placeholder="clipboard / text input"></textarea>
                    </div>
                    <button class="mini-control-button" id="screenToggle2" onclick="toggleScreenPowerMode(2)">Screen OFF keep stream</button>
                    <button class="mini-control-button" onclick="setClipboard(2)">Set clipboard</button>
                    <button class="mini-control-button" onclick="getClipboard(2)">Get clipboard</button>
                    <button class="mini-control-button" onclick="sendTextAsKeys(2)">Send as keys</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="video-container">
            <!-- Device 1 -->
            <div class="stream-panel">
                <div class="stream-content">
                    <video id="player1" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
                </div>
            </div>

            <!-- Device 2 -->
            <div class="stream-panel">
                <div class="stream-content">
                    <video id="player2" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('expanded');
        }
        const urlParams = new URLSearchParams(window.location.search);
        const device1Udid = urlParams.get('device1');
        const device2Udid = urlParams.get('device2');

        if (!device1Udid || !device2Udid) {
            alert('Both device1 and device2 must be specified.');
            window.location.href = '/';
            throw new Error('Devices not specified');
        }

        document.getElementById('deviceName1').textContent = `Device 1: ${device1Udid}`;
        document.getElementById('deviceName2').textContent = `Device 2: ${device2Udid}`;

        // Setup video parsers and muxers for both devices
        const devices = {
            1: { udid: device1Udid, videoEl: 'player1', indicator: 'indicator1' },
            2: { udid: device2Udid, videoEl: 'player2', indicator: 'indicator2' }
        };

        const muxers = {};
        const parsers = {};
        const inputs = {};
        const pendingDefaultScreenOff = { 1: true, 2: true };
        const screenPowerOn = { 1: false, 2: false };
        const lastVideoDataAt = { 1: Date.now(), 2: Date.now() };
        const stallPromptShown = { 1: false, 2: false };
        const autoResumeInProgress = { 1: false, 2: false };

        // Initialize muxer and parser for each device
        Object.keys(devices).forEach(deviceNum => {
            const device = devices[deviceNum];
            const videoElement = document.getElementById(device.videoEl);

            muxers[deviceNum] = new JMuxer({
                node: device.videoEl,
                mode: 'video',
                flushingTime: 0,
                fps: 60,
                clearBuffer: true,
                onReady: () => {
                    console.log(`Device ${deviceNum} MSE ready`);
                    if (videoElement) {
                        videoElement.controls = false;
                        videoElement.style.cssText = `
                            -webkit-media-controls: none !important;
                            -webkit-media-controls-enclosure: none !important;
                            -webkit-media-controls-panel: none !important;
                        `;
                    }
                },
                onError: (err) => {
                    console.error(`Device ${deviceNum} MSE Error:`, err);
                }
            });

            parsers[deviceNum] = new VideoParser(({ type, data }) => {
                if (type === 'nalu') {
                    muxers[deviceNum].feed({ video: data });
                } else if (type === 'init') {
                    muxers[deviceNum].feed({ video: data["sps"] });
                    muxers[deviceNum].feed({ video: data["pps"] });
                } else if (type === 'screen_size') {
                    initInput(deviceNum, data["width"], data["height"]);
                } else if (type === 'size_change') {
                    if (inputs[deviceNum]) {
                        inputs[deviceNum].resizeScreen(data["width"], data["height"]);
                    }
                }
            });
        });

        function initInput(deviceNum, width, height) {
            function input_data_cb(data) {
                socket.emit('control_data', {
                    device_udid: devices[deviceNum].udid,
                    data: data
                });
            }

            const videoElement = document.getElementById(devices[deviceNum].videoEl);
            inputs[deviceNum] = new ScrcpyInput(input_data_cb, videoElement, width, height, false);
            if (pendingDefaultScreenOff[deviceNum]) {
                setTimeout(() => {
                    setScreenPowerMode(deviceNum, false);
                }, 250);
            }
        }

        function sendControl(deviceNum, action) {
            if (!inputs[deviceNum]) return;

            const input = inputs[deviceNum];
            
            function injectKeyCode(keyCode, action) {
                try {
                    const data = input.createKeyProtocolData(action, keyCode, 0, 0);
                    socket.emit('control_data', {
                        device_udid: devices[deviceNum].udid,
                        data: data
                    });
                } catch (e) {
                    console.error('Error injecting key code:', e);
                }
            }

            const keyCodeMap = {
                'power': () => { input.screen_on_off(0); setTimeout(() => input.screen_on_off(1), 100); },
                'vol-down': () => { injectKeyCode(25, 0); setTimeout(() => injectKeyCode(25, 1), 100); },
                'vol-up': () => { injectKeyCode(24, 0); setTimeout(() => injectKeyCode(24, 1), 100); },
                'back': () => { injectKeyCode(4, 0); setTimeout(() => injectKeyCode(4, 1), 100); },
                'home': () => { injectKeyCode(3, 0); setTimeout(() => injectKeyCode(3, 1), 100); },
                'menu': () => { injectKeyCode(187, 0); setTimeout(() => injectKeyCode(187, 1), 100); }
            };

            if (keyCodeMap[action]) {
                keyCodeMap[action]();
            }
        }

        function setScreenPowerMode(deviceNum, isOn) {
            const input = inputs[deviceNum];
            if (!input) return;
            input.set_screen_power_mode(isOn);
            pendingDefaultScreenOff[deviceNum] = false;
            screenPowerOn[deviceNum] = isOn;
            const label = isOn ? 'Screen ON' : 'Screen OFF keep stream';
            document.getElementById(`screenToggle${deviceNum}`).textContent = label;
        }

        function toggleScreenPowerMode(deviceNum) {
            setScreenPowerMode(deviceNum, !screenPowerOn[deviceNum]);
        }

        function setClipboard(deviceNum) {
            const input = inputs[deviceNum];
            if (!input) return;
            const text = document.getElementById(`text${deviceNum}`).value || '';
            const data = input.createSetClipboardControlMessage(text, false);
            socket.emit('control_data', { device_udid: devices[deviceNum].udid, data });
        }

        function getClipboard(deviceNum) {
            const input = inputs[deviceNum];
            if (!input) return;
            const data = input.createGetClipboardControlMessage();
            socket.emit('control_data', { device_udid: devices[deviceNum].udid, data });
        }

        function sendTextAsKeys(deviceNum) {
            const input = inputs[deviceNum];
            if (!input) return;
            const text = document.getElementById(`text${deviceNum}`).value || '';
            if (!text) return;
            const data = input.createTextControlMessage(text);
            socket.emit('control_data', { device_udid: devices[deviceNum].udid, data });
        }

        const socket = io({
            reconnection: true,
            autoConnect: true
        });

        socket.on('video_data', (data) => {
            const deviceNum = data.device_udid === device1Udid ? 1 : (data.device_udid === device2Udid ? 2 : null);
            if (deviceNum && parsers[deviceNum]) {
                const newData = new Uint8Array(data.data);
                parsers[deviceNum].appendData(newData);
                lastVideoDataAt[deviceNum] = Date.now();
                stallPromptShown[deviceNum] = false;
            }
        });

        socket.on('device_message', async (payload) => {
            if (!payload) return;
            const deviceNum = payload.device_udid === device1Udid ? 1 : (payload.device_udid === device2Udid ? 2 : null);
            if (!deviceNum) return;
            const message = payload.message || {};
            if (message.type === 'clipboard') {
                const text = message.text || '';
                document.getElementById(`text${deviceNum}`).value = text;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch (e) {
                        console.debug('Clipboard write failed:', e);
                    }
                }
            }
        });

        socket.on('connect', () => {
            console.log('Connected to server, starting devices...');
            socket.emit('start_device', { device_udid: device1Udid });
            socket.emit('start_device', { device_udid: device2Udid });
        });

        socket.on('device_started', (data) => {
            if (data.device_udid === device1Udid) {
                document.getElementById('indicator1').classList.remove('loading');
                console.log('Device 1 started');
            } else if (data.device_udid === device2Udid) {
                document.getElementById('indicator2').classList.remove('loading');
                console.log('Device 2 started');
            }
        });

        socket.on('error', (error) => {
            console.error('Socket error:', error);
        });

        socket.on('disconnect', () => {
            document.getElementById('indicator1').classList.add('loading');
            document.getElementById('indicator2').classList.add('loading');
            pendingDefaultScreenOff[1] = true;
            pendingDefaultScreenOff[2] = true;
            stallPromptShown[1] = false;
            stallPromptShown[2] = false;
            console.log('Disconnected from server');
        });

        function reconnectDevice(deviceNum) {
            const udid = devices[deviceNum].udid;
            socket.emit('stop_device', { device_udid: udid });
            setTimeout(() => {
                socket.emit('start_device', { device_udid: udid });
            }, 300);
        }

        function reconnectDeviceAuto(deviceNum, reason) {
            if (autoResumeInProgress[deviceNum]) return;
            autoResumeInProgress[deviceNum] = true;
            console.log(`Attempting auto-resume reconnect for device ${deviceNum} (${reason})...`);
            reconnectDevice(deviceNum);
            setTimeout(() => {
                autoResumeInProgress[deviceNum] = false;
            }, 2500);
        }

        setInterval(() => {
            const stalledThresholdMs = 45000;
            if (!socket.connected) return;
            [1, 2].forEach((deviceNum) => {
                if (Date.now() - lastVideoDataAt[deviceNum] > stalledThresholdMs && !stallPromptShown[deviceNum]) {
                    stallPromptShown[deviceNum] = true;
                    const shouldReconnect = confirm(`Device ${deviceNum} stream appears stalled. Reconnect now?`);
                    if (shouldReconnect) {
                        reconnectDevice(deviceNum);
                    } else {
                        lastVideoDataAt[deviceNum] = Date.now();
                    }
                }
            });
        }, 5000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible' || !socket.connected) {
                return;
            }
            const snapshots = { 1: lastVideoDataAt[1], 2: lastVideoDataAt[2] };
            setTimeout(() => {
                [1, 2].forEach((deviceNum) => {
                    const staleMs = Date.now() - lastVideoDataAt[deviceNum];
                    const noNewFramesAfterVisible = lastVideoDataAt[deviceNum] === snapshots[deviceNum];
                    if (noNewFramesAfterVisible && staleMs > 5000) {
                        reconnectDeviceAuto(deviceNum, 'tab-visible-no-frames');
                    }
                });
            }, 2500);
        });

        function goBack() {
            if (confirm('Stop streaming both devices and go back?')) {
                socket.emit('stop_device', { device_udid: device1Udid });
                socket.emit('stop_device', { device_udid: device2Udid });
                socket.disconnect();
                window.location.href = '/';
            }
        }

        window.addEventListener('beforeunload', () => {
            socket.emit('stop_device', { device_udid: device1Udid });
            socket.emit('stop_device', { device_udid: device2Udid });
            socket.disconnect();
        });
    </script>
</body>

</html>
