<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Dual Device Stream - Web Scrcpy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #222;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 1px solid #444;
        }

        .header-left {
            display: flex;
            gap: 30px;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .device-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4caf50;
        }

        .device-indicator.loading {
            background-color: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-right {
            display: flex;
            gap: 15px;
        }

        .btn-header {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background-color: #444;
            color: white;
            transition: background-color 0.3s;
        }

        .btn-header:hover {
            background-color: #555;
        }

        .video-container {
            flex: 1;
            display: flex;
            gap: 2px;
            overflow: hidden;
        }

        .stream-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            border: 1px solid #333;
            position: relative;
        }

        .stream-header {
            background-color: #222;
            color: #aaa;
            padding: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .stream-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: black;
        }

        .controls-bar {
            display: flex;
            gap: 5px;
            padding: 8px;
            background-color: #222;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        .control-icon {
            flex: 1;
            min-height: 30px;
            padding: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #eee;
            border: 1px solid #333;
            border-radius: 3px;
            text-align: center;
            transition: all 0.2s;
            background-color: #333;
        }

        .control-icon:hover {
            background-color: #444;
            color: #007BFF;
        }

        .controls-label {
            width: 100%;
            font-size: 10px;
            color: #666;
            text-align: center;
            padding: 2px 0 4px 0;
        }

        @media (max-width: 1024px) {
            .video-container {
                flex-direction: column;
            }

            .stream-panel {
                height: 50%;
            }

            .controls-bar {
                flex-direction: row;
            }

            .control-icon {
                flex: 1;
            }
        }
    </style>
    <script src="/static/js/socket.io.js"></script>
    <script src="/static/js/input.js"></script>
    <script src="/static/js/exp-golomb.js"></script>
    <script src="/static/js/h264-sps-parser.js"></script>
    <script src="/static/js/video_parser.js"></script>
    <script src="/static/js/jmuxer.min.js"></script>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="device-header">
                <span class="device-indicator loading" id="indicator1"></span>
                <span id="deviceName1">Device 1: Loading...</span>
            </div>
            <div class="device-header">
                <span class="device-indicator loading" id="indicator2"></span>
                <span id="deviceName2">Device 2: Loading...</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-header" onclick="goBack()">← Back</button>
        </div>
    </div>

    <div class="video-container">
        <!-- Device 1 -->
        <div class="stream-panel">
            <div class="stream-header">
                <span>Device 1</span>
            </div>
            <div class="stream-content">
                <video id="player1" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
            </div>
            <div class="controls-bar" id="controls1">
                <span class="controls-label">Controls</span>
                <button class="control-icon" title="Power" onclick="sendControl(1, 'power')"><i class="fa-solid fa-power-off"></i></button>
                <button class="control-icon" title="Back" onclick="sendControl(1, 'back')"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="control-icon" title="Home" onclick="sendControl(1, 'home')"><i class="fa-solid fa-house"></i></button>
                <button class="control-icon" title="Menu" onclick="sendControl(1, 'menu')"><i class="fa-solid fa-bars"></i></button>
                <button class="control-icon" title="Volume Down" onclick="sendControl(1, 'vol-down')"><i class="fa-solid fa-volume-down"></i></button>
                <button class="control-icon" title="Volume Up" onclick="sendControl(1, 'vol-up')"><i class="fa-solid fa-volume-up"></i></button>
            </div>
        </div>

        <!-- Device 2 -->
        <div class="stream-panel">
            <div class="stream-header">
                <span>Device 2</span>
            </div>
            <div class="stream-content">
                <video id="player2" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
            </div>
            <div class="controls-bar" id="controls2">
                <span class="controls-label">Controls</span>
                <button class="control-icon" title="Power" onclick="sendControl(2, 'power')"><i class="fa-solid fa-power-off"></i></button>
                <button class="control-icon" title="Back" onclick="sendControl(2, 'back')"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="control-icon" title="Home" onclick="sendControl(2, 'home')"><i class="fa-solid fa-house"></i></button>
                <button class="control-icon" title="Menu" onclick="sendControl(2, 'menu')"><i class="fa-solid fa-bars"></i></button>
                <button class="control-icon" title="Volume Down" onclick="sendControl(2, 'vol-down')"><i class="fa-solid fa-volume-down"></i></button>
                <button class="control-icon" title="Volume Up" onclick="sendControl(2, 'vol-up')"><i class="fa-solid fa-volume-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Get devices from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const device1Udid = urlParams.get('device1');
        const device2Udid = urlParams.get('device2');

        if (!device1Udid || !device2Udid) {
            alert('Both device1 and device2 must be specified.');
            window.location.href = '/';
            throw new Error('Devices not specified');
        }

        document.getElementById('deviceName1').textContent = `Device 1: ${device1Udid}`;
        document.getElementById('deviceName2').textContent = `Device 2: ${device2Udid}`;

        // Setup video parsers and muxers for both devices
        const devices = {
            1: { udid: device1Udid, videoEl: 'player1', indicator: 'indicator1' },
            2: { udid: device2Udid, videoEl: 'player2', indicator: 'indicator2' }
        };

        const muxers = {};
        const parsers = {};
        const inputs = {};

        // Initialize muxer and parser for each device
        Object.keys(devices).forEach(deviceNum => {
            const device = devices[deviceNum];
            const videoElement = document.getElementById(device.videoEl);

            muxers[deviceNum] = new JMuxer({
                node: device.videoEl,
                mode: 'video',
                flushingTime: 0,
                fps: 60,
                clearBuffer: true,
                onReady: () => {
                    console.log(`Device ${deviceNum} MSE ready`);
                    if (videoElement) {
                        videoElement.controls = false;
                        videoElement.style.cssText = `
                            -webkit-media-controls: none !important;
                            -webkit-media-controls-enclosure: none !important;
                            -webkit-media-controls-panel: none !important;
                        `;
                    }
                },
                onError: (err) => {
                    console.error(`Device ${deviceNum} MSE Error:`, err);
                }
            });

            parsers[deviceNum] = new VideoParser(({ type, data }) => {
                if (type === 'nalu') {
                    muxers[deviceNum].feed({ video: data });
                } else if (type === 'init') {
                    muxers[deviceNum].feed({ video: data["sps"] });
                    muxers[deviceNum].feed({ video: data["pps"] });
                } else if (type === 'screen_size') {
                    initInput(deviceNum, data["width"], data["height"]);
                } else if (type === 'size_change') {
                    if (inputs[deviceNum]) {
                        inputs[deviceNum].resizeScreen(data["width"], data["height"]);
                    }
                }
            });
        });

        function initInput(deviceNum, width, height) {
            function input_data_cb(data) {
                socket.emit('control_data', {
                    device_udid: devices[deviceNum].udid,
                    data: data
                });
            }

            const videoElement = document.getElementById(devices[deviceNum].videoEl);
            inputs[deviceNum] = new ScrcpyInput(input_data_cb, videoElement, width, height, false);
        }

        function sendControl(deviceNum, action) {
            if (!inputs[deviceNum]) return;

            const input = inputs[deviceNum];
            
            function injectKeyCode(keyCode, action) {
                try {
                    const data = input.createKeyProtocolData(action, keyCode, 0, 0);
                    socket.emit('control_data', {
                        device_udid: devices[deviceNum].udid,
                        data: data
                    });
                } catch (e) {
                    console.error('Error injecting key code:', e);
                }
            }

            const keyCodeMap = {
                'power': () => { input.screen_on_off(0); setTimeout(() => input.screen_on_off(1), 100); },
                'vol-down': () => { injectKeyCode(25, 0); setTimeout(() => injectKeyCode(25, 1), 100); },
                'vol-up': () => { injectKeyCode(24, 0); setTimeout(() => injectKeyCode(24, 1), 100); },
                'back': () => { injectKeyCode(4, 0); setTimeout(() => injectKeyCode(4, 1), 100); },
                'home': () => { injectKeyCode(3, 0); setTimeout(() => injectKeyCode(3, 1), 100); },
                'menu': () => { injectKeyCode(187, 0); setTimeout(() => injectKeyCode(187, 1), 100); }
            };

            if (keyCodeMap[action]) {
                keyCodeMap[action]();
            }
        }

        const socket = io({
            reconnection: true,
            autoConnect: true
        });

        socket.on('video_data', (data) => {
            const deviceNum = data.device_udid === device1Udid ? 1 : (data.device_udid === device2Udid ? 2 : null);
            if (deviceNum && parsers[deviceNum]) {
                const newData = new Uint8Array(data.data);
                parsers[deviceNum].appendData(newData);
            }
        });

        socket.on('connect', () => {
            console.log('Connected to server, starting devices...');
            socket.emit('start_device', { device_udid: device1Udid });
            socket.emit('start_device', { device_udid: device2Udid });
        });

        socket.on('device_started', (data) => {
            if (data.device_udid === device1Udid) {
                document.getElementById('indicator1').classList.remove('loading');
                console.log('Device 1 started');
            } else if (data.device_udid === device2Udid) {
                document.getElementById('indicator2').classList.remove('loading');
                console.log('Device 2 started');
            }
        });

        socket.on('error', (error) => {
            console.error('Socket error:', error);
        });

        socket.on('disconnect', () => {
            document.getElementById('indicator1').classList.add('loading');
            document.getElementById('indicator2').classList.add('loading');
            console.log('Disconnected from server');
        });

        function goBack() {
            if (confirm('Stop streaming both devices and go back?')) {
                socket.emit('stop_device', { device_udid: device1Udid });
                socket.emit('stop_device', { device_udid: device2Udid });
                socket.disconnect();
                window.location.href = '/';
            }
        }

        window.addEventListener('beforeunload', () => {
            socket.emit('stop_device', { device_udid: device1Udid });
            socket.emit('stop_device', { device_udid: device2Udid });
            socket.disconnect();
        });
    </script>
</body>

</html>
